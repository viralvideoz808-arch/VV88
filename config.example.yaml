# Copy to config.yaml and edit. Secrets go in .env (see .env.example), never in this file.
data_dir: data

# Only clip footage a campaign provides (or that you own). Add your own channels here.
rights_mode: campaign_only
rights_allowlist: []
#  - youtube.com/@your-own-channel

discovery:
  manual_file: campaigns.yaml        # campaigns you joined by hand (see campaigns.example.yaml)
  refresh_hours: 6
  whop_apify:                        # Whop Content Rewards listings via Apify (needs APIFY_TOKEN)
    enabled: false
    min_budget_remaining_usd: 50
    campaign_type: clipping

niche:                               # live "which niche is hot this week" signal (needs YOUTUBE_API_KEY)
  region_code: US
  lookback_days: 7

ranking:
  prior_views_per_clip: 1500         # starting guess per platform until your own numbers come in
  campaigns_per_cycle: 2

analysis:
  whisper_model: small               # tiny/base = faster, medium/large-v3 = more accurate
  whisper_device: auto               # cuda if you have an NVIDIA GPU
  min_clip_seconds: 20
  max_clip_seconds: 60
  target_clip_seconds: 38
  clips_per_source: 5

llm:                                 # optional Claude re-ranker + copywriter (paid API, ~cents per source)
  enabled: false
  model: claude-opus-5-5
  effort: medium

editing:
  styles: [karaoke_pop, dynamic_minimal, soft_lowercase, brainrot_stack]
  force_style: null                  # e.g. karaoke_pop to disable A/B testing
  font: Inter Black                  # any installed font; or point fonts_dir at a folder of .ttf files
  fonts_dir: null
  gameplay_dir: null                 # folder of gameplay loops YOU own / royalty-free, for brainrot_stack
  reframe: auto                      # auto | face | center | blur
  preset: veryfast                   # x264 speed/size trade-off
  crf: 20

publishing:
  backend: dry_run                   # dry_run (writes data/outbox) | postiz | direct
  disclose_paid_partnership: true    # FTC + platform rules: paid clipping = paid promotion
  disclosure_tag: "#ad"
  slots_utc: ["02:00", "06:00", "12:00", "16:00", "21:00"]
  platforms:
    tiktok:    {enabled: true, daily_cap: 5, min_gap_minutes: 90}
    youtube:   {enabled: true, daily_cap: 8, min_gap_minutes: 60}
    instagram: {enabled: true, daily_cap: 8, min_gap_minutes: 60}
    x:         {enabled: true, daily_cap: 8, min_gap_minutes: 45}
  postiz:
    integrations:                    # ids from `postiz integrations:list`
      tiktok: ""
      youtube: ""
      instagram: ""
      x: ""

optimizer:
  half_life_days: 7                  # results older than a week count half as much
  metric_age_hours: 48               # judge a post on its first 48 h
  explore_floor: 0.1
