<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · CAR-LOS console</title><meta name="robots" content="noindex"><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/ops.css"></head>
<body><div class="login"><form class="card" method="post" action="/login">
  <div class="brand" style="color:var(--ink);padding:0 0 14px"><span class="mark" style="color:#fff">🚗</span><div>CAR-LOS<small>OPERATIONS CONSOLE</small></div></div>
  {% if error %}<div class="banner bad">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="pw">Password</label><input type="password" id="pw" name="password" autofocus required autocomplete="current-password"></div>
  <button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button>
  <p class="help" style="margin-top:12px">The password is CARLOS_OPS_PASSWORD in your .env file (printed when the server first started).</p>
</form></div></body></html>
