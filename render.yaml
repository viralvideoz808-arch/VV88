# Render Blueprint for pumpscan (the 25-agent pump.fun scanner in ./pumpscan).
# Render: New > Blueprint > pick this repo. It asks for PUMPSCAN_PASSWORD once.
services:
  - type: web
    name: pumpscan
    runtime: docker
    rootDir: pumpscan
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free plan: 750 instance hours a month, enough for one service around the clock.
    # Free services sleep after 15 idle minutes; pumpscan pings its own RENDER_EXTERNAL_URL
    # every 10 minutes to stay awake. There is no disk on the free plan, so the signal
    # history starts over whenever Render restarts or redeploys the service.
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PUMPSCAN_PASSWORD
        sync: false
      - key: PUMPSCAN_PUMPPORTAL_API_KEY
        sync: false
