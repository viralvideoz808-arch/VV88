[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpscan"
version = "0.1.0"
description = "Pump.fun memecoin scanner: 25 analysis agents vote on every live coin and emit a BUY signal only when they reach consensus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pumpscan = "pumpscan.__main__:main"

[tool.setuptools.packages.find]
include = ["pumpscan*"]

[tool.setuptools.package-data]
"pumpscan" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
